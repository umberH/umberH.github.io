<!-- Preload critical resources -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

<!-- Preload critical CSS -->
<link rel="preload" href="{{ '/assets/css/style.css' | relative_url }}" as="style">

<!-- Preload critical images -->
{% if page.url == "/" %}
<link rel="preload" href="{{ '/assets/images/dp.webp' | relative_url }}" as="image" type="image/webp">
{% endif %}

<!-- Optimize font loading -->
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
</noscript>
