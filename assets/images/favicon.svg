<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
  ═══════════════════════════════════════════
  FAVICON — AH Monogram
  ═══════════════════════════════════════════
  To edit:

  COLORS
  · Background circle:  fill="#1a1410"  (dark — matches hero/footer)
  · Letters A H:        fill="#fdf8f6"  (warm parchment)
  · Accent dot/line:    fill="#d4a0a0"  (powder pink — var --color-300)

  LETTERS
  · Font is embedded as paths — to change letterforms,
    open in Figma / Illustrator / Inkscape and retype
    with your chosen font, then outline the text.

  SIZE
  · viewBox="0 0 32 32" — standard favicon size
  · Scale up to 180x180 for apple-touch-icon by
    changing width/height attributes only

  ═══════════════════════════════════════════
  -->

  <!-- Background: dark rounded square -->
  <rect width="32" height="32" rx="7" ry="7" fill="#1a1410"/>

  <!-- Subtle inner border for depth -->
  <rect x="1" y="1" width="30" height="30" rx="6.5" ry="6.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Pink accent bar — top left corner detail -->
  <rect x="4" y="4" width="8" height="1.5" rx="0.75" fill="#d4a0a0" opacity="0.9"/>

  <!-- Letter A -->
  <!-- Elegant geometric A: two diagonal strokes + crossbar -->
  <g fill="#fdf8f6">
    <!-- Left diagonal of A -->
    <polygon points="6,23 9.2,9 10.8,9 8,23" opacity="0.95"/>
    <!-- Right diagonal of A -->
    <polygon points="13.6,23 10.8,9 12.4,9 15.2,23" opacity="0.95"/>
    <!-- Crossbar of A -->
    <rect x="7.4" y="17.2" width="6" height="1.5" rx="0.5"/>
  </g>

  <!-- Letter H -->
  <g fill="#fdf8f6" opacity="0.95">
    <!-- Left stroke of H -->
    <rect x="17" y="9" width="1.8" height="14" rx="0.5"/>
    <!-- Right stroke of H -->
    <rect x="23.2" y="9" width="1.8" height="14" rx="0.5"/>
    <!-- Crossbar of H -->
    <rect x="17" y="15.2" width="8" height="1.6" rx="0.5"/>
  </g>

  <!-- Pink accent dot — bottom right -->
  <circle cx="27.5" cy="27.5" r="1.8" fill="#d4a0a0" opacity="0.85"/>

</svg>
